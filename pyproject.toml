[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canine-genome-dsp"
version = "0.1.0"
description = "Reproducible DSP analyses of canine genomes and variant tracks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "PyWavelets>=1.5",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "xlrd>=2.0",
  "torch>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
canine-dsp = "canine_dsp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/canine_dsp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
